 PERTANYAAN","DEFINISI AWAL PEMECAH BATU","HUKUM PERTAMA — UNKNOWN TETAP UNKNOWN","FONDASI TASK 24–30","BATAS BESAR — DISCOVERY BUKAN VALIDATION","ARSITEKTUR PEMECAH BATU","ENGINE 2 — SIGNAL / STRUCTURE INSPECTOR","ENGINE 3 — FRAMING DETECTOR","ENGINE 4 — PROTOCOL FAMILY CLASSIFIER","ENGINE 5 — FINGERPRINT ENGINE","ENGINE 6 — PARSER WORKBENCH","ENGINE 7 — DIFFERENTIAL ANALYZER","ENGINE 8 — MULTI-SAMPLE CORRELATION","ENGINE 9 — EVIDENCE GATE","ENGINE 10 — REPLAY LAB","ENGINE 11 — ROBUSTNESS / FUZZ TEST","ENGINE 12 — PROFILE BUILDER","STATUS HASIL RESMI","AI DALAM PEMECAH BATU","SECURITY BOUNDARY","PEMISAHAN REPOSITORY","TIGA WILAYAH AUTHORITY","OPEN PROFILE LIBRARY","FIELD DEVICE EVIDENCE","DARI PROTOCOL KE PRINSIP YANG LEBIH BESAR","MULTI PEMECAH","KESEHATAN ADALAH IMPLEMENTASI PERTAMA","TETAPI PEMECAH BATU TIDAK MEMBUTUHKAN OTRIS","FULL OPEN SOURCE","CONSTITUTIONAL CORE","HUMAN BURDEN PRINCIPLE","VALUE PRINCIPLE","PROPORTIONALITY PRINCIPLE","ARTIFICIAL DEPENDENCY PRINCIPLE","FREEDOM-OF-CHOICE TEST","PRINCIPLE OF CARE","GROWTH OF GIVING","RANCANGAN PRODUK V1","FLOW V1","RANCANGAN REPOSITORY","DEVELOPMENT ORDER","HUBUNGAN DENGAN OTRIS","BATAS ANTARA OTRIS DAN PEMECAH BATU","POSISI AKHIR","DARI GAGASAN MENJADI SISTEM"],bf=[{num:1,title:x[0],blocks:[{type:"p",text:"Semua bermula di lapangan, bukan di ruang desain. Di puskesmas, di gudang alat, di meja operator yang harus memindahkan data pasien dari satu sistem ke sistem lain dengan cara manual. Masalah yang terlihat sederhana: dua alat bisa menyala, tapi tidak bisa bicara."},{type:"p",text:"Kita mengasumsikan interoperabilitas adalah soal kabel dan format file. Kenyataannya, batu pertama yang menghalangi adalah asumsi. Setiap vendor membuat dialeknya sendiri, setiap rumah sakit membuat kebiasaan sendiri, dan tidak ada yang mencatat dengan jujur apa yang sebenarnya terjadi di kabel."},{type:"pre",text:`Lapangan
  ├── Alat A: mengirim HL7 v2.5 dengan Z-segment lokal
  ├── Alat B: mengklaim HL7 v2.5, tapi field OBX-5 di-encode base64
  ├── Operator: copy-paste ke Excel
  └── Hasil: data hilang, waktu hilang, kepercayaan hilang
        ↓
  Pertanyaan: mengapa kita terus membangun jembatan tanpa mengukur sungai?`},{type:"p",text:"Pemecah Batu lahir dari kebutuhan untuk melihat batu itu apa adanya. Bukan untuk memaksa semua orang menggunakan satu protokol, tapi untuk memiliki alat yang bisa jujur mengatakan: ini yang saya lihat, ini yang saya tidak tahu."}]},{num:2,title:x[1],blocks:[{type:"p",text:"Pertanyaan ekonomi bukan soal harga alat, tapi soal biaya ketidakpastian. Berapa biaya satu integrasi gagal? Berapa biaya satu malam lembur operator karena interface error? Berapa biaya vendor lock-in yang tidak terlihat di kontrak awal?"},{type:"p",text:"Model ekonomi lama mengasumsikan integrasi adalah one-time cost. Kenyataan di lapangan: integrasi adalah recurring tax. Setiap update firmware, setiap perubahan konfigurasi lab, setiap rumah sakit baru, pajak itu dibayar lagi."},{type:"pre",text:`Biaya Nyata Interoperabilitas
  ┌─────────────────────────┐
  │ Lisensi Interface: $X    │
  ├─────────────────────────┤
  │ + Custom mapping: 3-6 bulan │
  │ + Maintenance tahunan: 20% │
  │ + Gagal → manual work  │
  └─────────────────────────┘
        ↓
  Total Cost of Confusion >> Total Cost of Ownership`}]},{num:3,title:x[2],blocks:[{type:"p",text:"Pertanyaan kemanusiaan lebih mendasar: siapa yang menanggung beban ketika sistem tidak interoperable? Bukan vendor. Bukan manajemen. Tapi perawat yang harus mengetik ulang, dokter yang menunggu hasil, pasien yang menunggu keputusan."},{type:"p",text:"Human Burden Principle muncul di sini. Jika sistem membuat manusia harus menjadi jembatan, maka sistem itu gagal. Teknologi seharusnya mengurangi beban, bukan memindahkannya ke bahu yang paling lemah."}]},{num:4,title:x[3],blocks:[{type:"p",text:"Batu pertama yang harus dipecah adalah asumsi bahwa interoperabilitas adalah soal menyamakan protokol. Padahal, interoperabilitas adalah soal kemampuan untuk hidup berdampingan dengan perbedaan, sambil tetap jujur tentang batas pengetahuan."},{type:"pre",text:`Interoperabilitas ≠ Uniformitas
  ├── Uniformitas: semua pakai FHIR R4
  ├── Realita: 40 tahun legacy, ribuan dialek
  └── Interoperabilitas Sejati:
        ├── Deteksi apa yang ada
        ├── Jangan klaim yang tidak ada
        └── Bangun bukti, bukan asumsi`}]},{num:5,title:x[4],blocks:[{type:"p",text:"OTRIS Gateway mengajarkan bahwa gateway yang baik bukan yang paling pintar, tapi yang paling jujur mencatat. OTRIS tidak mencoba menebak, ia merekam, menandai, dan memisahkan wilayah authority."},{type:"p",text:"Pelajaran terbesar: jangan campur discovery dengan validation. Discovery adalah upaya melihat. Validation adalah upaya menilai. Jika dicampur, kita akan melihat apa yang ingin kita lihat, bukan apa yang ada."}]},{num:6,title:x[5],blocks:[{type:"p",text:"Perubahan pertanyaan adalah momen kunci. Dari 'bagaimana membuat semua sistem bicara?' menjadi 'bagaimana kita bisa tahu dengan pasti apa yang dibicarakan sistem, tanpa harus percaya klaimnya?'."},{type:"p",text:"Pertanyaan baru ini memindahkan fokus dari standardisasi paksa ke observasi yang dapat diverifikasi. Pemecah Batu bukan penerjemah, tapi saksi."}]},{num:7,title:x[6],blocks:[{type:"p",text:"Definisi awal: Pemecah Batu adalah Open Interoperability Framework for Humanity — seperangkat engine yang bekerja berurutan untuk memecah kebingungan protokol menjadi bukti yang dapat diuji."},{type:"pre",text:`Pemecah Batu = 
  ├── Discovery Engine Chain (2-8)
  ├── Evidence Gate (9)
  ├── Verification Lab (10-11)
  └── Profile Builder (12)
        ↓
  Output: Open Profile (bukan klaim, tapi bukti)`}]},{num:8,title:x[7],blocks:[{type:"p",text:"Hukum pertama: Unknown tetap Unknown. Jika kita tidak tahu, kita katakan tidak tahu. Tidak ada tebak-tebakan, tidak ada default yang berbahaya. Setiap field yang tidak bisa dibuktikan, ditandai sebagai UNKNOWN dengan alasan."},{type:"p",text:"Ini adalah fondasi kepercayaan. Lebih baik sistem berkata 'saya tidak tahu arti byte ini' daripada mengarang dan menyebabkan kesalahan medis."}]},{num:9,title:x[8],blocks:[{type:"p",text:"Fondasi Task 24-30 di OTRIS adalah cikal bakal. Task 24: capture raw. Task 25: timestamp. Task 26: provenance. Task 27-30: pemisahan wilayah. Semua itu mengajarkan bahwa data tanpa konteks adalah bahaya."}]},{num:10,title:x[9],blocks:[{type:"p",text:"Batas besar yang harus dijaga: Discovery bukan Validation. Discovery menjawab 'apa yang ada?'. Validation menjawab 'apakah ini benar menurut standar?'. Pemecah Batu hanya melakukan yang pertama."},{type:"pre",text:`Discovery                          Validation
  ├── Apa bytes ini?                ├── Apakah ini sesuai HL7?
  ├── Seberapa sering muncul?       ├── Apakah ini valid FHIR?
  └── Dari mana asalnya?            └── (Bukan tugas Pemecah Batu)

  Pemecah Batu berhenti di Discovery + Evidence`}]},{num:11,title:x[10],blocks:[{type:"p",text:"Arsitektur Pemecah Batu adalah pipeline 12 engine yang dirancang untuk berjalan offline, deterministik, dan dapat direproduksi. Tidak ada panggilan AI yang tidak dapat dijelaskan, tidak ada jaringan yang diperlukan saat memecah."},{type:"pre",text:`Arsitektur Lengkap
  Input: Raw Capture (pcap, serial log, file)
    ├── Engine 2: Signal / Structure Inspector
    ├── Engine 3: Framing Detector
    ├── Engine 4: Protocol Family Classifier
    ├── Engine 5: Fingerprint Engine
    ├── Engine 6: Parser Workbench
    ├── Engine 7: Differential Analyzer
    ├── Engine 8: Multi-Sample Correlation
    ├── Engine 9: Evidence Gate ← BATAS
    ├── Engine 10: Replay Lab
    ├── Engine 11: Robustness / Fuzz Test
    └── Engine 12: Profile Builder
  Output: Open Profile (.yaml + evidence bundle)`}]},{num:12,title:x[11],blocks:[{type:"p",text:"Engine 2 melihat sinyal, bukan protokol. Apakah ini biner atau teks? Apakah ada periodicitas? Apakah ada panjang tetap atau delimiter? Tugasnya adalah menjawab tanpa berasumsi protokol."},{type:"pre",text:`Engine 2 Output Example
  ├── Entropy: 4.2 bits/byte (low → structured)
  ├── Printable ratio: 87%
  ├── Delimiter candidate: 0x0D 0x0A (92%)
  └── Structure: line-oriented, avg 64 bytes`}]},{num:13,title:x[12],blocks:[{type:"p",text:"Framing Detector mencari bingkai. Di mana pesan dimulai dan berakhir? Apakah ada STX/ETX, length prefix, atau newline? Engine ini tidak peduli isi, hanya bingkai."},{type:"pre",text:`Framing
  ├── [STX] ... [ETX]  → MLLP
  ├── Length + Payload → ASTM
  └── \\n delimited → CSV / HL7-like
        ↓
  Output: frame boundaries + confidence`}]},{num:14,title:x[13],blocks:[{type:"p",text:"Protocol Family Classifier mengelompokkan tanpa memvonis. Apakah ini keluarga HL7, ASTM, FHIR, atau proprietary? Klasifikasi berdasarkan fitur struktural, bukan klaim vendor."}]},{num:15,title:x[14],blocks:[{type:"p",text:"Fingerprint Engine mencari sidik jari unik: urutan field yang selalu muncul, magic bytes, pola OBX, atau checksum. Sidik jari ini menjadi identitas, bukan versi yang diklaim."},{type:"pre",text:`Fingerprint
  ├── HL7-like but OBX-5 = base64 PNG
  ├── MSH-9 = ORU^R01 but no OBR
  └── Fingerprint: hl7_z_lab_base64_obx_v1`}]},{num:16,title:x[15],blocks:[{type:"p",text:"Parser Workbench adalah tempat manusia dan mesin bekerja bersama. Mesin mengusulkan parse tree, manusia mengoreksi, dan semua koreksi dicatat sebagai evidence, bukan sebagai rule tersembunyi."}]},{num:17,title:x[16],blocks:[{type:"p",text:"Differential Analyzer membandingkan dua sample yang seharusnya sama tapi hasilnya beda. Di mana letak perbedaan? Apakah di timestamp, di ID, atau di encoding? Ini adalah cara tercepat menemukan field yang volatile."}]},{num:18,title:x[17],blocks:[{type:"p",text:"Multi-Sample Correlation mencari yang konstan di banyak sample. Field yang selalu sama adalah kandidat untuk device ID, lab ID, atau versi. Field yang selalu berubah adalah kandidat untuk measurement atau timestamp."}]},{num:19,title:x[18],blocks:[{type:"p",text:"Evidence Gate adalah batas paling penting. Tidak ada profil yang lolos tanpa bukti. Setiap klaim harus punya minimal 3 sample, screenshot, atau pcap. Tidak ada bukti, tidak ada profil. Gate ini yang menjaga agar Pemecah Batu tetap jujur."},{type:"pre",text:`Evidence Gate Checklist
  ├── [ ] Minimal 3 raw captures
  ├── [ ] Provenance tercatat (alat, lokasi, waktu)
  ├── [ ] Unknown fields ditandai eksplisit
  ├── [ ] Tidak ada asumsi tanpa bukti
  └── [ ] Reproducible di Replay Lab`}]},{num:20,title:x[19],blocks:[{type:"p",text:"Replay Lab adalah tempat profil diuji ulang terhadap capture asli. Apakah parser yang dibangun bisa mem-parse ulang 100% capture tanpa kehilangan? Jika tidak, profil ditolak."}]},{num:21,title:x[20],blocks:[{type:"p",text:"Robustness dan Fuzz Test memastikan parser tidak crash ketika diberi data rusak. Kesehatan adalah domain di mana crash bisa berarti data pasien hilang. Parser harus gagal dengan anggun, bukan dengan diam."}]},{num:22,title:x[21],blocks:[{type:"p",text:"Profile Builder menghasilkan Open Profile: file YAML yang bisa dibaca manusia, berisi fingerprint, framing, field map, unknown map, dan evidence bundle. Profil ini open source, bukan milik vendor."},{type:"pre",text:`open_profile:
  name: hl7_z_lab_base64_obx_v1
  family: hl7_v2
  framing: mllp
  fields:
    - path: OBX.5
      type: base64_png
      evidence: samples/003.png.b64
  unknowns:
    - path: ZXX.3
      reason: single sample only
  evidence_bundle: ./evidence/`}]},{num:23,title:x[22],blocks:[{type:"p",text:"Status hasil resmi bukan 'valid' atau 'invalid', tapi 'evidence-backed' atau 'insufficient evidence'. Pemecah Batu tidak pernah menghakimi protokol, ia hanya melaporkan apa yang bisa dibuktikan."}]},{num:24,title:x[23],blocks:[{type:"p",text:"AI dalam Pemecah Batu bukan untuk menebak protokol, tapi untuk mempercepat pekerjaan manusia: mengusulkan framing, mengelompokkan sample serupa, dan menandai anomali. Keputusan akhir tetap di tangan manusia dan Evidence Gate."},{type:"pre",text:`AI Boundary
  ├── Boleh: clustering, anomaly detection, suggestion
  └── Tidak boleh: final classification tanpa evidence
        ↓
  Human-in-the-loop adalah hukum`}]},{num:25,title:x[24],blocks:[{type:"p",text:"Security Boundary memisahkan parsing dari eksekusi. Parser tidak pernah mengeksekusi payload, tidak pernah membuka koneksi balik, dan tidak pernah menyimpan credential. Semua dijalankan di sandbox."}]},{num:26,title:x[25],blocks:[{type:"p",text:"Pemisahan repository adalah keputusan arsitektural: satu repo untuk engine (core), satu repo untuk profiles (open), satu repo untuk evidence (private per deployment). Core tidak pernah mengandung data pasien."}]},{num:27,title:x[26],blocks:[{type:"p",text:"Tiga wilayah authority: Device Authority (apa yang dikirim alat), Site Authority (apa yang dikonfigurasi di lokasi), dan Human Authority (apa yang diputuskan operator). Ketiganya harus dicatat terpisah."},{type:"pre",text:`Tiga Wilayah
  ├── Device Authority: firmware, model
  ├── Site Authority: mapping lokal, Z-segment
  └── Human Authority: koreksi manual, interpretasi
        ↓
  Jangan campur, catat semua`}]},{num:28,title:x[27],blocks:[{type:"p",text:"Open Profile Library adalah perpustakaan sidik jari protokol yang terbuka untuk semua. Siapa pun bisa submit profil baru, tapi harus lewat Evidence Gate. Tidak ada profil tanpa bukti."}]},{num:29,title:x[28],blocks:[{type:"p",text:"Field Device Evidence adalah bukti langsung dari lapangan: foto layar alat, pcap, log serial. Tanpa ini, semua klaim adalah teori. Dengan ini, kita bisa membangun kepercayaan."}]},{num:30,title:x[29],blocks:[{type:"p",text:"Dari protokol ke prinsip yang lebih besar: masalah interoperabilitas bukan hanya di kesehatan, tapi di semua tempat di mana manusia harus menjadi jembatan antar sistem. Prinsip yang sama bisa diterapkan di logistik, pendidikan, energi."}]},{num:31,title:x[30],blocks:[{type:"p",text:"Multi Pemecah berarti kita tidak membangun satu pemecah untuk semua, tapi banyak pemecah kecil yang spesifik. Satu pemecah untuk satu keluarga protokol. Kecil, fokus, dapat diverifikasi."}]},{num:32,title:x[31],blocks:[{type:"p",text:"Kesehatan adalah implementasi pertama karena dampaknya paling nyata: nyawa. Tapi arsitektur dirancang agar tidak terikat pada kesehatan. Jika berhasil di kesehatan, ia akan berhasil di mana saja."}]},{num:33,title:x[32],blocks:[{type:"p",text:"Tetapi Pemecah Batu tidak membutuhkan OTRIS. OTRIS adalah gateway, Pemecah Batu adalah alat observasi. Keduanya bisa hidup terpisah. Pemecah Batu bisa digunakan bahkan tanpa OTRIS, sebagai alat analisis offline."}]},{num:34,title:x[33],blocks:[{type:"p",text:"Full Open Source bukan sekadar lisensi, tapi strategi. Jika profil dikunci vendor, maka interoperabilitas dikunci. Open Profile memastikan tidak ada yang bisa memonopoli pengetahuan tentang bagaimana alat bicara."}]},{num:35,title:x[34],blocks:[{type:"p",text:"Constitutional Core adalah inti yang tidak bisa diubah sembarangan: Hukum Unknown tetap Unknown, Evidence Gate wajib, dan Human Authority di atas AI. Semua perubahan core harus lewat diskusi publik."}]},{num:36,title:x[35],blocks:[{type:"p",text:"Human Burden Principle: teknologi tidak boleh menambah beban manusia untuk mengkompensasi kegagalan sistem. Jika operator harus copy-paste, itu adalah bug, bukan fitur."}]},{num:37,title:x[36],blocks:[{type:"p",text:"Value Principle: nilai diukur dari berkurangnya beban manusia, bukan dari banyaknya fitur. Satu parser yang menyelamatkan 10 menit per hari per perawat lebih berharga daripada dashboard yang indah tapi tidak dipakai."}]},{num:38,title:x[37],blocks:[{type:"p",text:"Proportionality Principle: upaya harus proporsional dengan risiko. Untuk data observasi, discovery ringan cukup. Untuk data yang mempengaruhi keputusan klinis, evidence harus kuat."}]},{num:39,title:x[38],blocks:[{type:"p",text:"Artificial Dependency Principle: jangan ciptakan ketergantungan buatan. Jika alat bisa langsung kirim FHIR, jangan paksa lewat gateway proprietary. Pemecah Batu membantu, bukan mengunci."}]},{num:40,title:x[39],blocks:[{type:"p",text:"Freedom-of-Choice Test: apakah pengguna masih punya pilihan untuk tidak menggunakan Pemecah Batu dan tetap bisa interoperable? Jika tidak, maka kita telah menciptakan lock-in baru. Test ini harus lolos."}]},{num:41,title:x[40],blocks:[{type:"p",text:"Principle of Care: dalam keraguan, pilih yang paling aman untuk pasien. Jika ragu apakah field adalah mg/dL atau mmol/L, tandai UNKNOWN dan minta konfirmasi manusia. Jangan tebak."}]},{num:42,title:x[41],blocks:[{type:"p",text:"Growth of Giving: semakin banyak profil dibuka, semakin banyak yang terbantu, semakin banyak yang memberi kembali. Ini adalah siklus positif open source yang dirancang, bukan kebetulan."}]},{num:43,title:x[42],blocks:[{type:"p",text:"Rancangan Produk V1 adalah CLI dan library, bukan SaaS. Alasan: agar bisa jalan offline di puskesmas tanpa internet. Produk adalah alat, bukan layanan yang mengunci."},{type:"pre",text:`V1 Product
  ├── pemecah inspect <file.pcap>
  ├── pemecah profile build --evidence ./ev/
